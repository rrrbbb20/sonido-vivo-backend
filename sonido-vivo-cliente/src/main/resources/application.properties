# Nombre del microservicio
spring.application.name=sonido-vivo-cliente

# Puerto del microservicio
server.port=8091

# Conexion a MySQL
spring.datasource.url=${CLIENTES_DB_URL:jdbc:mysql://localhost:3306/sonido_vivo_clientes?createDatabaseIfNotExist=true}
spring.datasource.username=${CLIENTES_DB_USER:root}
spring.datasource.password=${CLIENTES_DB_PASSWORD:}

# Configuracion JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# Swagger
springdoc.swagger-ui.path=/swagger-ui.html

# Seguridad JWT (mismos nombres de propiedad que ms-producto)
app.jwt.secret=${JWT_SECRET}
app.jwt.issuer=sonido-vivo-auth

# URL de Auth para WebClient
app.auth.url=${AUTH_SERVICE_URL:http://localhost:8082/api/v1/auth}