server.address=127.0.0.1
server.port=8091

spring.datasource.url=${CLIENTES_DB_URL}
spring.datasource.username=${CLIENTES_DB_USER}
spring.datasource.password=${CLIENTES_DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

app.jwt.secret=${JWT_SECRET}
app.jwt.issuer=sonido-vivo-auth

app.auth.url=${AUTH_SERVICE_URL}

app.cors.allowed-origin=${APP_CORS_ALLOWED_ORIGIN}