spring.application.name=sonido-vivo-contacto
server.port=8092

spring.datasource.url=${CONTACTO_DB_URL:jdbc:mysql://localhost:3306/sonido_vivo_contacto?createDatabaseIfNotExist=true}
spring.datasource.username=${CONTACTO_DB_USER:root}
spring.datasource.password=${CONTACTO_DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

springdoc.swagger-ui.path=/swagger-ui.html

app.jwt.secret=${JWT_SECRET}
app.jwt.issuer=sonido-vivo-auth