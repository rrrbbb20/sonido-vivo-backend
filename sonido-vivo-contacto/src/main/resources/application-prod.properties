server.address=127.0.0.1
server.port=8092
spring.datasource.url=${CONTACTO_DB_URL}
spring.datasource.username=${CONTACTO_DB_USER}
spring.datasource.password=${CONTACTO_DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
app.jwt.secret=${JWT_SECRET}
app.jwt.issuer=sonido-vivo-auth
app.cors.allowed-origin=${APP_CORS_ALLOWED_ORIGIN}