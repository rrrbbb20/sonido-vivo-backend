spring.application.name=sonido-vivo-pedido
server.address=127.0.0.1
server.port=8093

spring.datasource.url=${PEDIDOS_DB_URL}
spring.datasource.username=${PEDIDOS_DB_USER}
spring.datasource.password=${PEDIDOS_DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

app.productos.url=${PRODUCTOS_URL}

app.jwt.secret=${JWT_SECRET}
app.jwt.issuer=sonido-vivo-auth

app.cors.allowed-origin=${APP_CORS_ALLOWED_ORIGIN}