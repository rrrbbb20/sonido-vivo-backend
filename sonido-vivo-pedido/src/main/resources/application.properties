spring.application.name=sonido-vivo-pedido
server.port=8093

spring.datasource.url=${PEDIDOS_DB_URL:jdbc:mariadb://localhost:3306/sonido_vivo_pedidos?createDatabaseIfNotExist=true}
spring.datasource.username=${PEDIDOS_DB_USER:root}
spring.datasource.password=${PEDIDOS_DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

app.productos.url=http://localhost:8090/api/v1/productos

app.jwt.secret=${JWT_SECRET}
app.jwt.issuer=sonido-vivo-auth