# Nombre del microservicio
spring.application.name=ms-producto

# Puerto del microservicio
server.port=8090

# Conexion a MySQL
spring.datasource.url=${PRODUCTOS_DB_URL:jdbc:mysql://localhost:3306/sonido_vivo_productos?createDatabaseIfNotExist=true}
spring.datasource.username=${PRODUCTOS_DB_USER:root}
spring.datasource.password=${PRODUCTOS_DB_PASSWORD:}

# Configuracion JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# Swagger
springdoc.swagger-ui.path=/swagger-ui.html

# Seguridad JWT
app.jwt.secret=${JWT_SECRET}
app.jwt.issuer=sonido-vivo-auth