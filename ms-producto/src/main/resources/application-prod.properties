server.address=127.0.0.1
server.port=8090

spring.datasource.url=${PRODUCTOS_DB_URL}
spring.datasource.username=${PRODUCTOS_DB_USER}
spring.datasource.password=${PRODUCTOS_DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

app.jwt.secret=${JWT_SECRET}
app.jwt.issuer=sonido-vivo-auth

app.cors.allowed-origin=${APP_CORS_ALLOWED_ORIGIN}