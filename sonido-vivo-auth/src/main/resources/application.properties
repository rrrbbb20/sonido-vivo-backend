spring.application.name=sonido-vivo-auth
server.port=8082

spring.datasource.url=${AUTH_DB_URL:jdbc:mysql://localhost:3306/sonido_vivo_auth?createDatabaseIfNotExist=true}
spring.datasource.username=${AUTH_DB_USER:root}
spring.datasource.password=${AUTH_DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

springdoc.swagger-ui.path=/swagger-ui.html

app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=3600000
app.jwt.issuer=sonido-vivo-auth

app.admin.correo=${ADMIN_CORREO}
app.admin.password=${ADMIN_PASSWORD}